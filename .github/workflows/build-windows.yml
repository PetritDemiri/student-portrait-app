name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed to attach the .exe to a release

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"  # test output contains ë, ç, č ...

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Test sorting and file handling
        run: python -m pytest

      - name: Package with PyInstaller
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name FotoNxenesit --collect-data customtkinter --add-data "tests;tests" foto_nxenesit.py

      - name: Upload the build
        uses: actions/upload-artifact@v6
        with:
          name: FotoNxenesit-windows
          path: dist/FotoNxenesit.exe
          retention-days: 30
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/FotoNxenesit.exe
          generate_release_notes: true
